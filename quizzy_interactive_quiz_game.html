<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quizzy - Friendly Interactive Quiz Game</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Modern Friendly Fonts: Fredoka & Quicksand -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            font-family: 'Quicksand', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
            min-height: 100vh;
            color: #f8fafc;
        }
        
        .font-heading {
            font-family: 'Fredoka', sans-serif;
            text-transform: none !important;
        }

        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .glass-button {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            transition: all 0.2s ease-in-out;
        }

        .glass-button:hover {
            background: rgba(255, 255, 255, 0.18);
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -5px rgba(0, 0, 0, 0.3);
        }

        /* Owl animation keyframes */
        @keyframes owlFloat {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-8px) rotate(1deg); }
        }

        @keyframes owlBlink {
            0%, 90%, 100% { transform: scaleY(1); }
            95% { transform: scaleY(0.1); }
        }

        .owl-float {
            animation: owlFloat 4s ease-in-out infinite;
        }

        .owl-eye {
            transform-origin: center;
            animation: owlBlink 5s infinite;
        }
    </style>
</head>
<body class="flex flex-col min-h-screen justify-between p-4 md:p-8">

    <!-- Top Navigation Header -->
    <header class="max-w-5xl mx-auto w-full flex items-center justify-between mb-6">
        <div class="flex items-center space-x-3">
            <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-indigo-500 to-purple-500 flex items-center justify-center shadow-lg shadow-indigo-500/30">
                <i class="fa-solid fa-graduation-cap text-2xl text-white"></i>
            </div>
            <div>
                <h1 class="font-heading text-2xl md:text-3xl font-bold tracking-wide text-transparent bg-clip-text bg-gradient-to-r from-indigo-300 via-purple-200 to-pink-300">
                    Quizzy
                </h1>
                <p class="text-xs text-indigo-200/70 font-medium">Your Casual Quiz Buddy</p>
            </div>
        </div>

        <!-- Header Actions -->
        <div class="flex items-center space-x-3">
            <button id="voiceToggleBtn" onclick="toggleVoice()" class="glass-button p-3 rounded-xl text-indigo-200 hover:text-white flex items-center space-x-2 text-sm font-semibold">
                <i id="voiceIcon" class="fa-solid fa-volume-high text-lg"></i>
                <span id="voiceStatus" class="hidden sm:inline">Voice On</span>
            </button>
            <button onclick="showLeaderboard()" class="glass-button p-3 rounded-xl text-indigo-200 hover:text-white flex items-center space-x-2 text-sm font-semibold">
                <i class="fa-solid fa-trophy text-amber-400 text-lg"></i>
                <span class="hidden sm:inline">Leaderboard</span>
            </button>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-4xl mx-auto w-full flex-grow flex flex-col justify-center">

        <!-- SETUP SCREEN -->
        <section id="setupScreen" class="glass-panel p-6 md:p-10 rounded-3xl shadow-2xl relative overflow-hidden">
            <div class="text-center max-w-xl mx-auto">
                <!-- Mascot Greeting -->
                <div class="w-28 h-28 mx-auto mb-4 owl-float relative">
                    <svg viewBox="0 0 100 100" class="w-full h-full drop-shadow-xl">
                        <path d="M20,80 Q50,95 80,80 Q90,50 80,20 Q50,10 20,20 Q10,50 20,80 Z" fill="#6366f1"/>
                        <circle cx="35" cy="40" r="14" fill="#ffffff"/>
                        <circle cx="65" cy="40" r="14" fill="#ffffff"/>
                        <circle class="owl-eye" cx="35" cy="40" r="6" fill="#1e1b4b"/>
                        <circle class="owl-eye" cx="65" cy="40" r="6" fill="#1e1b4b"/>
                        <polygon points="50,45 44,55 56,55" fill="#f59e0b"/>
                        <path d="M30,70 Q50,82 70,70" stroke="#a5b4fc" stroke-width="4" fill="none" stroke-linecap="round"/>
                    </svg>
                </div>

                <h2 class="font-heading text-3xl md:text-4xl font-bold mb-2 text-white">Hi, I'm Pip!</h2>
                <p class="text-indigo-200 mb-8 text-base md:text-lg">What topic would you like to explore today?</p>

                <div class="space-y-5 text-left">
                    <div>
                        <label class="block text-sm font-semibold text-indigo-200 mb-2">Nickname</label>
                        <input type="text" id="playerNickname" placeholder="Enter your friendly nickname" class="w-full px-4 py-3 rounded-xl bg-slate-900/60 border border-indigo-500/30 text-white placeholder-slate-400 focus:outline-none focus:border-indigo-400 focus:ring-2 focus:ring-indigo-400/20 font-medium">
                    </div>

                    <div>
                        <label class="block text-sm font-semibold text-indigo-200 mb-2">Quiz Topic</label>
                        <div class="flex gap-2">
                            <input type="text" id="topicInput" placeholder="e.g., Space Exploration, Pop Music, Ancient Egypt..." class="flex-grow px-4 py-3 rounded-xl bg-slate-900/60 border border-indigo-500/30 text-white placeholder-slate-400 focus:outline-none focus:border-indigo-400 focus:ring-2 focus:ring-indigo-400/20 font-medium">
                            <button onclick="randomTopic()" class="glass-button px-4 py-3 rounded-xl text-indigo-300 hover:text-white font-semibold flex items-center gap-2">
                                <i class="fa-solid fa-dice"></i>
                                <span class="hidden sm:inline">Surprise Me</span>
                            </button>
                        </div>
                    </div>

                    <div>
                        <div class="flex justify-between items-center mb-2">
                            <label class="text-sm font-semibold text-indigo-200">Difficulty Level</label>
                            <span id="difficultyLabel" class="text-xs font-bold px-3 py-1 rounded-full bg-emerald-500/20 text-emerald-300 border border-emerald-500/30">Casual</span>
                        </div>
                        <input type="range" id="difficultySlider" min="1" max="3" value="1" oninput="updateDifficultyLabel(this.value)" class="w-full accent-indigo-500 bg-slate-800 rounded-lg cursor-pointer h-2">
                    </div>

                    <button onclick="startQuiz()" class="w-full py-4 mt-4 rounded-xl bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500 text-white font-heading text-lg font-bold shadow-lg shadow-indigo-500/30 hover:opacity-95 transition-all transform hover:-translate-y-0.5">
                        Start Quiz Challenge
                    </button>
                </div>
            </div>
        </section>

        <!-- GAMEPLAY SCREEN -->
        <section id="gameScreen" class="hidden glass-panel p-6 md:p-8 rounded-3xl shadow-2xl relative">
            <!-- Top Game Bar -->
            <div class="flex flex-wrap items-center justify-between gap-4 mb-6 pb-4 border-b border-white/10">
                <div class="flex items-center space-x-3">
                    <div class="w-10 h-10 owl-float">
                        <svg viewBox="0 0 100 100" class="w-full h-full">
                            <circle cx="50" cy="50" r="45" fill="#6366f1"/>
                            <circle cx="35" cy="40" r="12" fill="#ffffff"/>
                            <circle cx="65" cy="40" r="12" fill="#ffffff"/>
                            <circle class="owl-eye" cx="35" cy="40" r="5" fill="#1e1b4b"/>
                            <circle class="owl-eye" cx="65" cy="40" r="5" fill="#1e1b4b"/>
                            <polygon points="50,45 45,52 55,52" fill="#f59e0b"/>
                        </svg>
                    </div>
                    <div>
                        <p id="pipSpeech" class="text-sm text-indigo-200 font-medium italic">"Ready when you are!"</p>
                        <p id="topicDisplay" class="text-xs text-indigo-300/70 font-semibold"></p>
                    </div>
                </div>

                <div class="flex items-center space-x-4">
                    <!-- Health / Energy Bar -->
                    <div class="flex flex-col items-end">
                        <span class="text-xs font-semibold text-indigo-200 mb-1">Energy</span>
                        <div class="w-28 h-3 bg-slate-800 rounded-full overflow-hidden p-0.5 border border-white/10">
                            <div id="healthBar" class="h-full bg-gradient-to-r from-emerald-400 to-teal-400 rounded-full transition-all duration-500" style="width: 100%;"></div>
                        </div>
                    </div>
                    <!-- Question Tracker -->
                    <div class="text-right">
                        <span id="questionNum" class="font-heading text-xl font-bold text-white">1</span>
                        <span class="text-xs text-indigo-300">/50</span>
                    </div>
                </div>
            </div>

            <!-- Question Card -->
            <div class="mb-6">
                <h3 id="questionText" class="font-heading text-xl md:text-2xl font-semibold text-white leading-relaxed mb-6">
                    Loading your custom question...
                </h3>

                <!-- Options Grid -->
                <div id="optionsContainer" class="grid grid-cols-1 md:grid-cols-2 gap-3">
                    <!-- Generated Option Buttons -->
                </div>
            </div>

            <!-- Bottom Actions -->
            <div class="flex flex-wrap items-center justify-between gap-3 pt-4 border-t border-white/10">
                <button onclick="changeTopic()" class="glass-button px-4 py-2.5 rounded-xl text-xs font-semibold text-indigo-200 hover:text-white flex items-center gap-2">
                    <i class="fa-solid fa-arrows-rotate"></i>
                    <span>Change Topic</span>
                </button>

                <div class="flex items-center space-x-2">
                    <button onclick="askPipHint()" class="glass-button px-4 py-2.5 rounded-xl text-xs font-semibold text-amber-300 hover:text-amber-200 flex items-center gap-2">
                        <i class="fa-solid fa-lightbulb"></i>
                        <span>Ask Pip for a Hint</span>
                    </button>
                    <button id="nextBtn" onclick="nextQuestion()" disabled class="px-5 py-2.5 rounded-xl bg-indigo-600 disabled:opacity-40 text-white font-heading text-sm font-semibold shadow-md transition-all">
                        Next Question
                    </button>
                </div>
            </div>
        </section>

        <!-- RESULTS SCREEN -->
        <section id="resultScreen" class="hidden glass-panel p-8 md:p-10 rounded-3xl shadow-2xl text-center">
            <div class="w-24 h-24 mx-auto mb-4 owl-float">
                <svg viewBox="0 0 100 100" class="w-full h-full">
                    <circle cx="50" cy="50" r="45" fill="#8b5cf6"/>
                    <circle cx="35" cy="40" r="12" fill="#ffffff"/>
                    <circle cx="65" cy="40" r="12" fill="#ffffff"/>
                    <circle class="owl-eye" cx="35" cy="40" r="5" fill="#1e1b4b"/>
                    <circle class="owl-eye" cx="65" cy="40" r="5" fill="#1e1b4b"/>
                    <path d="M40,65 Q50,55 60,65" stroke="#ffffff" stroke-width="4" fill="none" stroke-linecap="round"/>
                </svg>
            </div>
            <h2 class="font-heading text-3xl font-bold text-white mb-2">Great Job!</h2>
            <p id="resultSummary" class="text-indigo-200 mb-6 text-base"></p>
            
            <div class="inline-block glass-panel px-8 py-4 rounded-2xl mb-8">
                <span class="text-xs text-indigo-300 font-semibold block uppercase tracking-wider mb-1">Final Score</span>
                <span id="finalScore" class="font-heading text-4xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-teal-200">0</span>
            </div>

            <div class="flex justify-center gap-4">
                <button onclick="restartGame()" class="px-6 py-3 rounded-xl bg-indigo-500 text-white font-heading font-semibold hover:bg-indigo-600 transition-all">
                    Play Again
                </button>
                <button onclick="showLeaderboard()" class="glass-button px-6 py-3 rounded-xl text-indigo-200 font-heading font-semibold hover:text-white">
                    View Leaderboard
                </button>
            </div>
        </section>

        <!-- LEADERBOARD MODAL -->
        <div id="leaderboardModal" class="hidden fixed inset-0 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4 z-50">
            <div class="glass-panel max-w-md w-full p-6 rounded-3xl shadow-2xl relative">
                <div class="flex justify-between items-center mb-6">
                    <h3 class="font-heading text-2xl font-bold text-white flex items-center gap-2">
                        <i class="fa-solid fa-trophy text-amber-400"></i>
                        Leaderboard
                    </h3>
                    <button onclick="closeLeaderboard()" class="text-slate-400 hover:text-white text-lg">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>
                <div id="leaderboardList" class="space-y-3 max-h-80 overflow-y-auto pr-1">
                    <!-- Dynamic Leaderboard Entries -->
                </div>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="max-w-5xl mx-auto w-full text-center py-4 text-xs text-indigo-300/60 font-medium">
        Quizzy Interactive Assistant • Friendly learning powered by AI
    </footer>

    <!-- Game Logic & Speech Synthesizer -->
    <script>
        // State variables
        let voiceEnabled = true;
        let currentQuestionIndex = 0;
        let score = 0;
        let health = 100;
        let questions = [];
        let currentTopic = "";
        let playerNickname = "Guest";
        let difficulty = 1;

        const defaultTopics = [
            "General Knowledge", "Space & Astronomy", "Pop Culture Trivia", 
            "World Geography", "Animal Kingdom", "Video Game Lore"
        ];

        // Speech Synthesis setup
        function speak(text) {
            if (!voiceEnabled || !('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.pitch = 1.2;
            utterance.rate = 1.0;
            window.speechSynthesis.speak(utterance);
        }

        function toggleVoice() {
            voiceEnabled = !voiceEnabled;
            const statusText = document.getElementById("voiceStatus");
            const icon = document.getElementById("voiceIcon");
            if (voiceEnabled) {
                statusText.innerText = "Voice On";
                icon.className = "fa-solid fa-volume-high text-lg";
                speak("Voice enabled!");
            } else {
                statusText.innerText = "Voice Off";
                icon.className = "fa-solid fa-volume-xmark text-lg";
                window.speechSynthesis.cancel();
            }
        }

        function updateDifficultyLabel(val) {
            difficulty = parseInt(val);
            const label = document.getElementById("difficultyLabel");
            if (val == 1) {
                label.innerText = "Casual";
                label.className = "text-xs font-bold px-3 py-1 rounded-full bg-emerald-500/20 text-emerald-300 border border-emerald-500/30";
            } else if (val == 2) {
                label.innerText = "Balanced";
                label.className = "text-xs font-bold px-3 py-1 rounded-full bg-amber-500/20 text-amber-300 border border-amber-500/30";
            } else {
                label.innerText = "Challenging";
                label.className = "text-xs font-bold px-3 py-1 rounded-full bg-rose-500/20 text-rose-300 border border-rose-500/30";
            }
        }

        function randomTopic() {
            const random = defaultTopics[Math.floor(Math.random() * defaultTopics.length)];
            document.getElementById("topicInput").value = random;
        }

        async function startQuiz() {
            const nickInput = document.getElementById("playerNickname").value.trim();
            const topicInput = document.getElementById("topicInput").value.trim();

            playerNickname = nickInput || "Friendly Explorer";
            currentTopic = topicInput || "General Knowledge";

            document.getElementById("setupScreen").classList.add("hidden");
            document.getElementById("gameScreen").classList.remove("hidden");
            document.getElementById("topicDisplay").innerText = `Topic: ${currentTopic}`;

            speak(`Awesome! Let's start the ${currentTopic} quiz!`);
            await generateQuestions(currentTopic);
            loadQuestion(0);
        }

        async function generateQuestions(topic) {
            // Gemini API call attempt with structured fallback
            const prompt = `Generate 50 friendly trivia questions about "${topic}" in JSON format. Return an array of objects where each object has: "question", "options" (array of 4 strings), "answer" (0-based index integer), and "hint" (short helpful string).`;
            
            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }] }],
                        generationConfig: { responseMimeType: "application/json" }
                    })
                });
                
                const data = await response.json();
                const jsonText = data.candidates?.[0]?.content?.parts?.[0]?.text;
                if (jsonText) {
                    questions = JSON.parse(jsonText);
                } else {
                    throw new Error("Invalid payload format");
                }
            } catch (err) {
                // Friendly Local Fallback Generator if network/API fails
                questions = Array.from({ length: 50 }, (_, i) => ({
                    question: `Sample Question ${i + 1} about ${topic}: What makes this topic fascinating?`,
                    options: [
                        "It expands our curiosity",
                        "It offers endless discoveries",
                        "It connects different ideas",
                        "All of the above"
                    ],
                    answer: 3,
                    hint: "Think about the overall positive impact of learning new things!"
                }));
            }
        }

        function loadQuestion(index) {
            if (index >= questions.length || health <= 0) {
                finishGame();
                return;
            }

            currentQuestionIndex = index;
            const q = questions[index];

            document.getElementById("questionNum").innerText = index + 1;
            document.getElementById("questionText").innerText = q.question;
            document.getElementById("nextBtn").disabled = true;

            const container = document.getElementById("optionsContainer");
            container.innerHTML = "";

            q.options.forEach((opt, idx) => {
                const btn = document.createElement("button");
                btn.className = "glass-button p-4 rounded-2xl text-left font-medium text-slate-200 hover:text-white flex items-center justify-between transition-all border border-white/10";
                btn.innerHTML = `<span>${opt}</span><i class="fa-regular fa-circle text-indigo-400/50 text-sm"></i>`;
                btn.onclick = () => handleAnswer(idx, btn);
                container.appendChild(btn);
            });

            document.getElementById("pipSpeech").innerText = `"Question ${index + 1}! You've got this!"`;
            speak(q.question);
        }

        function handleAnswer(selectedIndex, selectedBtn) {
            const q = questions[currentQuestionIndex];
            const buttons = document.querySelectorAll("#optionsContainer button");
            
            buttons.forEach(btn => btn.disabled = true);

            if (selectedIndex === q.answer) {
                selectedBtn.className = "p-4 rounded-2xl text-left font-medium text-white bg-emerald-500/30 border-2 border-emerald-400 flex items-center justify-between";
                selectedBtn.querySelector("i").className = "fa-solid fa-circle-check text-emerald-400 text-base";
                score += 100 * difficulty;
                document.getElementById("pipSpeech").innerText = `"Spot on! Excellent choice!"`;
                speak("Spot on! That's correct!");
            } else {
                selectedBtn.className = "p-4 rounded-2xl text-left font-medium text-white bg-rose-500/30 border-2 border-rose-400 flex items-center justify-between";
                selectedBtn.querySelector("i").className = "fa-solid fa-circle-xmark text-rose-400 text-base";
                
                // Highlight correct option
                buttons[q.answer].className = "p-4 rounded-2xl text-left font-medium text-white bg-emerald-500/20 border border-emerald-400/50 flex items-center justify-between";
                
                health = Math.max(0, health - (15 * difficulty));
                updateHealthBar();
                document.getElementById("pipSpeech").innerText = `"Don't worry! Keep going!"`;
                speak("Nice try! Don't worry, keep going!");
            }

            document.getElementById("nextBtn").disabled = false;
        }

        function updateHealthBar() {
            const bar = document.getElementById("healthBar");
            bar.style.width = `${health}%`;
            if (health < 30) {
                bar.className = "h-full bg-gradient-to-r from-rose-500 to-red-600 rounded-full transition-all duration-500";
            } else if (health < 60) {
                bar.className = "h-full bg-gradient-to-r from-amber-400 to-orange-500 rounded-full transition-all duration-500";
            }
        }

        function askPipHint() {
            const q = questions[currentQuestionIndex];
            const hintText = q.hint || "Take a close look at all the available options!";
            document.getElementById("pipSpeech").innerText = `"Hint: ${hintText}"`;
            speak(`Here is a hint: ${hintText}`);
        }

        function nextQuestion() {
            loadQuestion(currentQuestionIndex + 1);
        }

        function changeTopic() {
            document.getElementById("gameScreen").classList.add("hidden");
            document.getElementById("setupScreen").classList.remove("hidden");
            speak("Let's pick a new topic!");
        }

        function finishGame() {
            document.getElementById("gameScreen").classList.add("hidden");
            document.getElementById("resultScreen").classList.remove("hidden");
            document.getElementById("finalScore").innerText = score;
            document.getElementById("resultSummary").innerText = `Great effort, ${playerNickname}! You explored ${currentQuestionIndex + 1} questions on ${currentTopic}.`;

            saveScore(playerNickname, score);
            speak(`Great job, ${playerNickname}! Your final score is ${score}.`);
        }

        function restartGame() {
            health = 100;
            score = 0;
            updateHealthBar();
            document.getElementById("resultScreen").classList.add("hidden");
            document.getElementById("setupScreen").classList.remove("hidden");
        }

        // Leaderboard Persistent Storage
        function saveScore(name, finalScore) {
            const scores = JSON.parse(localStorage.getItem("quizzy_scores") || "[]");
            scores.push({ name, score: finalScore, date: new Date().toLocaleDateString() });
            scores.sort((a, b) => b.score - a.score);
            localStorage.setItem("quizzy_scores", JSON.stringify(scores.slice(0, 10)));
        }

        function showLeaderboard() {
            const modal = document.getElementById("leaderboardModal");
            const list = document.getElementById("leaderboardList");
            const scores = JSON.parse(localStorage.getItem("quizzy_scores") || "[]");

            if (scores.length === 0) {
                list.innerHTML = `<p class="text-sm text-slate-400 text-center py-4">No high scores recorded yet. Be the first!</p>`;
            } else {
                list.innerHTML = scores.map((s, i) => `
                    <div class="flex justify-between items-center p-3 rounded-xl bg-slate-900/50 border border-white/5">
                        <div class="flex items-center gap-3">
                            <span class="font-heading font-bold text-xs ${i === 0 ? 'text-amber-400' : 'text-slate-400'}">#${i + 1}</span>
                            <span class="font-semibold text-sm text-white">${s.name}</span>
                        </div>
                        <span class="font-heading font-bold text-emerald-400 text-sm">${s.score} pts</span>
                    </div>
                `).join('');
            }

            modal.classList.remove("hidden");
        }

        function closeLeaderboard() {
            document.getElementById("leaderboardModal").classList.add("hidden");
        }
    </script>
</body>
</html>
